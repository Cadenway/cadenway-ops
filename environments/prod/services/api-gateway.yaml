# Definition of api-gateway for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/api-gateway.yaml for the environment it deploys to.
#
# Exposed through Traefik on api.<domain>: it joins `edge` (what Traefik serves) and `internal` (the
# services it calls). No port is published; Traefik reaches the container on the `edge` network.
services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/cadenway-api-gateway:${API_GATEWAY_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3000'
      REDIS_URL: ${REDIS_URL}
    networks:
      - edge
      - internal
    # The environment in the router, service and network names keeps two stacks apart on one shared
    # Traefik.
    labels:
      - traefik.enable=true
      - traefik.docker.network=cadenway-edge-${ENVIRONMENT:-local}
      - traefik.http.routers.api-gateway-${ENVIRONMENT:-local}.rule=Host(`api.${DOMAIN}`)
      - traefik.http.services.api-gateway-${ENVIRONMENT:-local}.loadbalancer.server.port=3000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every definition it includes.
networks:
  # One edge network per environment, created on the host by the edge Traefik (cadenway-ops
  # compose/edge.yaml): staging and production containers never share a network.
  edge:
    name: cadenway-edge-${ENVIRONMENT:-local}
    external: true
  internal: {}
