# Definition of api-gateway for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/api-gateway.yaml for the environment it deploys to.
#
# Exposed through Traefik on api.<domain>: it joins `edge` (what Traefik serves) and `internal` (the
# services it calls). No port is published; Traefik reaches the container on the `edge` network.
services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/cadenway-api-gateway:${API_GATEWAY_VERSION}
    restart: unless-stopped
    # The entries of the gateway in cadenway-ops docs/service-environment.md, plus ALLOWED_ORIGINS,
    # built from DOMAIN and PUBLIC_SCHEME. Those two, REDIS_URL and the <NAME>_SERVICE_URL come from
    # the environment file Ansible writes on the host, the private key from the secrets of the
    # environment. The gateway trusts no issuer: it signs the calls it makes and authenticates the
    # applications itself.
    environment:
      PORT: '3000'
      REDIS_URL: ${REDIS_URL}
      # The web application and the website, the only origins CORS and the CSRF check accept.
      ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-https}://app.${DOMAIN},${PUBLIC_SCHEME:-https}://${DOMAIN}
      INTERNAL_TOKEN_ISSUER: api-gateway
      INTERNAL_TOKEN_PRIVATE_JWK: ${API_GATEWAY_INTERNAL_TOKEN_PRIVATE_JWK}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AUTOMATION_SERVICE_URL: ${AUTOMATION_SERVICE_URL}
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL}
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL}
    networks:
      - edge
      - internal
    # The environment in the router, service and network names keeps two stacks apart on one shared
    # Traefik.
    labels:
      - traefik.enable=true
      - traefik.docker.network=cadenway-edge-${ENVIRONMENT:-local}
      - traefik.http.routers.api-gateway-${ENVIRONMENT:-local}.rule=Host(`api.${DOMAIN}`)
      - traefik.http.services.api-gateway-${ENVIRONMENT:-local}.loadbalancer.server.port=3000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every definition it includes.
networks:
  # One edge network per environment, created on the host by the edge Traefik (cadenway-ops
  # compose/edge.yaml): staging and production containers never share a network.
  edge:
    name: cadenway-edge-${ENVIRONMENT:-local}
    external: true
  internal: {}
