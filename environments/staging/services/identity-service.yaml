# Definition of identity-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/identity-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs, the
# NATS password and the password pepper) are referenced by name; they live in cadenway-ops, which
# documents every variable below in docs/service-environment.md. A variable added here must exist
# on the host before the release that reads it: the GitOps agent refuses a commit that leaves one
# unset (IDENTITY_PASSWORD_PEPPER is there since cadenway-ops #19).
#
# INTERNAL_TOKEN_TRUSTED_ISSUERS lists who may call this service: the API gateway and the realtime
# gateway (ticket redemption). The folded scalar gives the service one line of JSON.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  identity-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-identity-service:${IDENTITY_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3010'
      DATABASE_URL: ${IDENTITY_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: identity
      NATS_PASSWORD: ${IDENTITY_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: identity-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "realtime-gateway": [${REALTIME_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      PASSWORD_PEPPER: ${IDENTITY_PASSWORD_PEPPER}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3010/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
