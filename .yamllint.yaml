# yamllint configuration of cadenway-ops: `yamllint .` from the repository root.
# Aligned on Prettier (100 columns), which formats the same files.
extends: default

# environments/*/services/ holds copies the deploy bot writes from each service's
# deploy/compose.yaml: they belong to the service repositories and are checked by their deploy
# workflow, so a style rule here would block pull requests on files this repository may not edit.
ignore: |
  node_modules/
  .ansible/
  .claude/
  .codex/
  pnpm-lock.yaml
  *.sops.*
  environments/*/services/

rules:
  document-start: disable
  line-length:
    max: 100
    # Image references pinned by digest are one unbreakable word.
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1
  # GitHub Actions keys `on:`; Compose and Ansible use true and false.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  braces:
    max-spaces-inside: 1
  # Required by ansible-lint.
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
