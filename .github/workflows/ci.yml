name: CI

on:
  pull_request:
  push:
    branches: [main]

# Each job states the permissions it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Validates the whole stack with the local values; nothing is started.
      - run: >-
          docker compose --env-file compose/.env.example
          -f compose/compose.yaml -f compose/compose.local.yaml --profile full config -q
      # The edge of a host, and each environment with the versions the agent would apply.
      - run: docker compose -f compose/edge.yaml config -q
        env:
          ACME_EMAIL: ci@example.com
      - run: |
          for env in staging prod; do
            ENVIRONMENT=$env CADENWAY_SERVICES=../environments/$env/services \
              docker compose -p "cadenway-$env" --env-file compose/.env.example \
              --env-file "environments/$env/versions.env" -f compose/compose.yaml config -q
          done

  operations:
    name: Ansible, YAML and agent lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the linters
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            ansible-core==2.19.4 ansible-lint==25.11.0 yamllint==1.37.1
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: yamllint --strict .
      - run: >-
          ansible-playbook -i ansible/inventory/hosts.example.yml
          --syntax-check ansible/playbooks/*.yml
      - run: ansible-lint ansible/
      - run: >-
          shellcheck agent/*.sh agent/tests/*.sh ansible/tests/*.sh
          ansible/roles/backup/files/*.sh ansible/roles/backup/tests/*.sh

  agent:
    name: GitOps agent and backups end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitOps agent
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/agent:/agent:ro"
          docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
          sh -c "apk add --no-cache bash >/dev/null && bash /agent/tests/e2e.sh"
      - name: Backup and restore
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/ansible/roles/backup:/backup:ro"
          docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
          sh -c "apk add --no-cache bash >/dev/null && bash /backup/tests/e2e.sh"

  host:
    name: Ansible on a throwaway host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Preview of a fresh host, first apply, idempotent second apply, preview of a set-up host.
      - run: bash ansible/tests/run.sh

  conventions:
    name: Commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pull request title becomes the squash commit on main.
      - run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
