- name: Check the backup recipient
  ansible.builtin.assert:
    that:
      - cadenway_backup_age_recipient is match('^age1[0-9a-z]+$')
    fail_msg: Set cadenway_backup_age_recipient to the public age key the dumps are encrypted to.
    quiet: true

- name: Check the backup manifest verification keys
  ansible.builtin.assert:
    that:
      - cadenway_backup_signing_public_keys is sequence
      - cadenway_backup_signing_public_keys is not string
      - cadenway_backup_signing_public_keys | length > 0
      - >-
        (cadenway_backup_signing_public_keys
        | select('match', cadenway_backup_signer_pattern) | list | length)
        == (cadenway_backup_signing_public_keys | length)
    fail_msg: >-
      Set cadenway_backup_signing_public_keys to trusted Ed25519 public keys
      in OpenSSH format without comments.
    quiet: true
  vars:
    cadenway_backup_signer_pattern: '^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}$'

- name: Install backup and object recovery clients
  ansible.builtin.apt:
    name:
      - openssh-client
      - rclone
      - python3-boto3
    state: present

- name: Pin the verification keys independently of the backup bucket
  ansible.builtin.copy:
    content: |
      {% for key in cadenway_backup_signing_public_keys %}
      cadenway-backup {{ key }}
      {% endfor %}
    dest: /etc/cadenway/backup-allowed-signers
    owner: root
    group: root
    mode: '0644'
  when: not cadenway_preview_first_run

- name: Write the backup configuration
  ansible.builtin.template:
    src: backup.env.j2
    dest: /etc/cadenway/backup.env
    owner: root
    group: root
    mode: '0640'
  when: not cadenway_preview_first_run

- name: Install the backup and restore scripts
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '/usr/local/bin/{{ item.dest }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - { src: cadenway-backup.sh, dest: cadenway-backup }
    - { src: cadenway-restore.sh, dest: cadenway-restore }

- name: Create the restore helper directory
  ansible.builtin.file:
    path: /usr/local/lib/cadenway
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: Install the storage object restore helper
  ansible.builtin.copy:
    src: cadenway-restore-objects.py
    dest: /usr/local/lib/cadenway/cadenway-restore-objects.py
    owner: root
    group: root
    mode: '0644'

- name: Install the backup units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - cadenway-backup.service
    - cadenway-backup.timer
  notify: Reload systemd for the backup units

- name: Load the new units before the timer starts
  ansible.builtin.meta: flush_handlers

- name: Start the backup timer
  ansible.builtin.systemd_service:
    name: cadenway-backup.timer
    enabled: true
    state: started
  when: not cadenway_preview_first_run
