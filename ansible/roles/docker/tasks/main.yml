- name: Remove the distribution's Docker packages
  ansible.builtin.apt:
    name: '{{ cadenway_docker_conflicting_packages }}'
    state: absent

- name: Install what the deb822 repository module needs
  ansible.builtin.apt:
    name: python3-debian
    state: present

# Needs python3-debian, which a first-run preview has not installed.
- name: Add Docker's APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    state: present
  when: not cadenway_preview_first_run

# A check-mode preview of a fresh host has not added the repository: nothing to install from yet.
- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: '{{ cadenway_docker_packages }}'
    state: present
    update_cache: true
  when: not cadenway_preview_first_run

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker
  when: not cadenway_preview_first_run

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not cadenway_preview_first_run
