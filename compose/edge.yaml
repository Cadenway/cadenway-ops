# Edge of a VPS: the Traefik that owns ports 80 and 443 for its assigned environment.
#
# A Compose project of its own (`cadenway-edge`), started once per host by the GitOps agent. It
# declares both edge network names (`cadenway-edge-staging`, `cadenway-edge-prod`). The assigned
# environment's public services join only its own network. The other network stays empty.
#
# Routers, services and networks carry the environment in their name (`api-gateway-staging`).
# Values come from /etc/cadenway/edge.env, written by Ansible.
name: cadenway-edge

services:
  docker-api-proxy:
    # Expose only the Docker metadata Traefik needs, over its dedicated network.
    image: node:24.22.3-alpine3.24@sha256:98e4e60b35fd50143e1838da2957488c25aa3a3efbd48bb679923f77d6d3d873
    restart: unless-stopped
    entrypoint: ['node', '/app/docker-api-proxy.mjs']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/docker-api-proxy.mjs:/app/docker-api-proxy.mjs:ro
    networks: [docker-api]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-api-proxy:8080
      # A container is served only when its definition carries `traefik.enable=true`.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - traefik-certificates:/letsencrypt
    # Each exposed container names its edge network in `traefik.docker.network`.
    networks:
      - edge-staging
      - edge-prod
      - docker-api
    depends_on:
      docker-api-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  docker-api:
    internal: true
  edge-staging:
    name: cadenway-edge-staging
  edge-prod:
    name: cadenway-edge-prod

volumes:
  traefik-certificates:
