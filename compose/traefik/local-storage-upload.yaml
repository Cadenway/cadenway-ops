http:
  routers:
    local-storage-upload:
      rule: >-
        Host(`{{ env "LOCAL_STORAGE_UPLOAD_HOST" }}`) &&
        Path(`/internal/v1/upload-transfers`) &&
        Method(`POST`)
      entryPoints: [web]
      service: local-storage-upload
  services:
    local-storage-upload:
      loadBalancer:
        servers:
          - url: http://storage-service:3015
