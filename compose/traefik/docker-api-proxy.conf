user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    # Check the original request target before Nginx normalizes its path.
    # Traefik negotiates an API version, so accept only numeric version components.
    map "$request_method:$request_uri" $docker_read_allowed {
        default 0;
        "~^HEAD:/_ping$" 1;
        "~^GET:/v[0-9]+\.[0-9]+/version$" 1;
        "~^GET:/v[0-9]+\.[0-9]+/containers/json(?:\?[^#]*)?$" 1;
        "~^GET:/v[0-9]+\.[0-9]+/containers/[0-9a-f]{64}/json$" 1;
        "~^GET:/v[0-9]+\.[0-9]+/events(?:\?[^#]*)?$" 1;
    }

    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location = /healthz {
            return 200;
        }

        location / {
            if ($docker_read_allowed = 0) {
                return 403;
            }

            proxy_pass http://unix:/var/run/docker.sock:;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
    }
}
