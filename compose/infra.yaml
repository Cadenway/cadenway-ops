# Shared infrastructure of the VPS: Traefik, PostgreSQL, Redis, NATS JetStream and Meilisearch.
#
# Traefik is the only container with published ports. Everything else stays on `internal`.
# Images are pinned by tag and digest; Renovate updates both together.
# Memory limits are starting values: adjust them once the VPS size is known.
services:
  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    command:
      - --providers.docker=true
      # A container is served only when its definition carries `traefik.enable=true`.
      - --providers.docker.exposedbydefault=false
      # The gateways are on two networks: Traefik must reach them on `edge`.
      - --providers.docker.network=cadenway_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Read-only: Traefik only lists containers and their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by postgres/init: one database and one user per service.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      AUTOMATION_DB_PASSWORD: ${AUTOMATION_DB_PASSWORD}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    restart: unless-stopped
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    volumes:
      - nats-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by every service definition this stack includes.
networks:
  edge: {}
  internal: {}

volumes:
  traefik-certificates:
  postgres-data:
  redis-data:
  nats-data:
  meilisearch-data:
