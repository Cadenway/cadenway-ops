# Shared infrastructure of one environment: PostgreSQL, Redis, NATS JetStream with its streams, and
# Meilisearch.
#
# Nothing here publishes a port: everything stays on `internal`. Traefik lives in edge.yaml,
# once per host, so several environments can share a VPS.
# Images are pinned by tag and digest; Renovate updates both together.
# Memory limits are starting values: adjust them once the VPS size is known.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by postgres/init: one database and two roles per service, the migrator that owns it
      # and the application role the service runs with (docs/database.md).
      IDENTITY_DB_MIGRATOR_PASSWORD: ${IDENTITY_DB_MIGRATOR_PASSWORD}
      IDENTITY_DB_APP_PASSWORD: ${IDENTITY_DB_APP_PASSWORD}
      ORGANIZATION_DB_MIGRATOR_PASSWORD: ${ORGANIZATION_DB_MIGRATOR_PASSWORD}
      ORGANIZATION_DB_APP_PASSWORD: ${ORGANIZATION_DB_APP_PASSWORD}
      BILLING_DB_MIGRATOR_PASSWORD: ${BILLING_DB_MIGRATOR_PASSWORD}
      BILLING_DB_APP_PASSWORD: ${BILLING_DB_APP_PASSWORD}
      TASK_DB_MIGRATOR_PASSWORD: ${TASK_DB_MIGRATOR_PASSWORD}
      TASK_DB_APP_PASSWORD: ${TASK_DB_APP_PASSWORD}
      DOCUMENT_DB_MIGRATOR_PASSWORD: ${DOCUMENT_DB_MIGRATOR_PASSWORD}
      DOCUMENT_DB_APP_PASSWORD: ${DOCUMENT_DB_APP_PASSWORD}
      STORAGE_DB_MIGRATOR_PASSWORD: ${STORAGE_DB_MIGRATOR_PASSWORD}
      STORAGE_DB_APP_PASSWORD: ${STORAGE_DB_APP_PASSWORD}
      NOTIFICATION_DB_MIGRATOR_PASSWORD: ${NOTIFICATION_DB_MIGRATOR_PASSWORD}
      NOTIFICATION_DB_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD}
      AUTOMATION_DB_MIGRATOR_PASSWORD: ${AUTOMATION_DB_MIGRATOR_PASSWORD}
      AUTOMATION_DB_APP_PASSWORD: ${AUTOMATION_DB_APP_PASSWORD}
      INTEGRATION_DB_MIGRATOR_PASSWORD: ${INTEGRATION_DB_MIGRATOR_PASSWORD}
      INTEGRATION_DB_APP_PASSWORD: ${INTEGRATION_DB_APP_PASSWORD}
      SEARCH_DB_MIGRATOR_PASSWORD: ${SEARCH_DB_MIGRATOR_PASSWORD}
      SEARCH_DB_APP_PASSWORD: ${SEARCH_DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    restart: unless-stopped
    command: ['--config', '/etc/nats/nats-server.conf']
    environment:
      # SHA-256 of nats/nats-server.conf. Compose recreates a container when its definition
      # changes, not when a file it mounts does: changing this value with the file is what makes
      # every environment restart the broker with the new permissions (tests/nats-permissions.sh
      # checks that the two match).
      NATS_SERVER_CONF_SHA256: d4b4272cde24fd0fcc3e1e078374a196a2a5c62636ba7152de5c1000dd8076b8
      # Read by nats/nats-server.conf: one user per backend, and the user that owns the streams.
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD}
      IDENTITY_NATS_PASSWORD: ${IDENTITY_NATS_PASSWORD}
      ORGANIZATION_NATS_PASSWORD: ${ORGANIZATION_NATS_PASSWORD}
      BILLING_NATS_PASSWORD: ${BILLING_NATS_PASSWORD}
      TASK_NATS_PASSWORD: ${TASK_NATS_PASSWORD}
      DOCUMENT_NATS_PASSWORD: ${DOCUMENT_NATS_PASSWORD}
      STORAGE_NATS_PASSWORD: ${STORAGE_NATS_PASSWORD}
      NOTIFICATION_NATS_PASSWORD: ${NOTIFICATION_NATS_PASSWORD}
      AUTOMATION_NATS_PASSWORD: ${AUTOMATION_NATS_PASSWORD}
      INTEGRATION_NATS_PASSWORD: ${INTEGRATION_NATS_PASSWORD}
      SEARCH_NATS_PASSWORD: ${SEARCH_NATS_PASSWORD}
      API_GATEWAY_NATS_PASSWORD: ${API_GATEWAY_NATS_PASSWORD}
      REALTIME_GATEWAY_NATS_PASSWORD: ${REALTIME_GATEWAY_NATS_PASSWORD}
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  nats-streams:
    # Owner of the JetStream streams: the backends may not create one. It applies
    # nats/ensure-streams.sh at start, then stays to recreate a stream the broker lost; it is
    # healthy while EVENTS, EVENTS_RESTRICTED, EVENTS_DLQ and the three advisory latches exist.
    # Local services and the GitOps agent wait for them. Operators read dead letters here and
    # clear latches after reconciliation (docs/messaging.md#realtime-authorization-advisories,
    # docs/messaging.md#rebuild-advisories).
    image: natsio/nats-box:0.20.2-nonroot@sha256:d00bffed51ea1a29e58852698bde37020d306af55585882f88dbcf09dd86f5fe
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/nats/ensure-streams.sh']
    environment:
      # SHA-256 of nats/ensure-streams.sh, for the same reason as NATS_SERVER_CONF_SHA256.
      ENSURE_STREAMS_SHA256: b1a8f0979ff78d6922bcc559eff3e58126d8ac565b1b425394613df3abf5935e
      NATS_URL: ${NATS_URL}
      NATS_USER: admin
      NATS_PASSWORD: ${NATS_ADMIN_PASSWORD}
    volumes:
      - ./nats/ensure-streams.sh:/etc/nats/ensure-streams.sh:ro
    networks:
      - internal
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-e', '/tmp/streams-ready']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 32M

  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by every service definition this stack includes.
networks:
  internal: {}

volumes:
  postgres-data:
  redis-data:
  nats-data:
  meilisearch-data:
