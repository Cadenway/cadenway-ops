http: 8222
jetstream {
  domain: DLQ_CAPTURE
  store_dir: /data
  max_mem: 16MB
  max_file: 96MB
}

authorization {
  users: [
    { user: "advisory-admin", password: $NATS_ADVISORY_ADMIN_PASSWORD }
    {
      user: "notification"
      password: $NATS_ADVISORY_READER_PASSWORD
      permissions {
        publish: [
          "$JS.API.CONSUMER.INFO.EVENTS_ADVISORIES.notification-dead-letter-advisories-v1",
          "$JS.API.CONSUMER.MSG.NEXT.EVENTS_ADVISORIES.notification-dead-letter-advisories-v1",
          "$JS.ACK.EVENTS_ADVISORIES.notification-dead-letter-advisories-v1.>",
          "$JS.ACK.DLQ_CAPTURE.*.EVENTS_ADVISORIES.notification-dead-letter-advisories-v1.>"
        ]
        subscribe: ["_INBOX.notification.>"]
      }
    }
  ]
}

leafnodes {
  remotes: [
    {
      url: $NATS_ADVISORY_HUB_LEAF_URL
      deny_exports: [">"]
    }
  ]
}
