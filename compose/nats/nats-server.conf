# NATS server of one environment: JetStream, and one user per backend (docs/messaging.md).
#
# A user may publish the events of the entities its backend owns (`evt.<entity>.>`) and re-emit
# their current state for a consumer that rebuilds (`rebuild.<consumer>.<entity>`), and nothing
# else. Events are read through JetStream consumers, never through a plain subscription: nobody may
# subscribe to `evt.>` or `restricted.>`, and a user receives its messages on its own inbox
# prefix, `_INBOX.<user>.>`, so no backend can listen to the replies of another one. A rebuild is
# plain NATS: a user may subscribe to `rebuild.<user>.>` only.
#
# Reading is granted per consumer, by its exact name (docs/messaging.md#consumers).
# @cadenway/nest-messaging gives each handler a durable pull consumer named `<service>__<handler>`
# that filters one event, and uses four subjects on it. A user is given these four for each of its
# own consumers, and no other consumer subject:
#   $JS.API.CONSUMER.CREATE.<stream>.<consumer>.<filter>  create it, or align its settings
#   $JS.API.CONSUMER.INFO.<stream>.<consumer>             read it
#   $JS.API.CONSUMER.MSG.NEXT.<stream>.<consumer>         pull from it
#   $JS.ACK.<stream>.<consumer>.>                         acknowledge, retry later or terminate
# No wildcard stands for a stream, a consumer or a filter: the last `>` covers only the delivery
# counters the server appends to the reply subject of a message. A backend therefore cannot create,
# read, pull from, acknowledge on or change the consumer of another one, nor open a consumer under
# a name it was not given, nor give its own consumer another filter: the server refuses a create
# whose body filters another subject than the request subject, or names another consumer. No
# backend may delete a consumer, its own included; an operator removes an obsolete one with the
# `admin` user. The other settings of its own consumers stay the owner's choice, a push delivery
# subject included (docs/messaging.md#what-a-grant-does-not-limit).
#
# A new handler needs its four subjects here, deployed to an environment before the release of the
# service that adds it, like a new environment variable: until then the create is refused and the
# service fails at start-up. The service repository reads them from its own code: <service> is the
# `service` option of its MessagingModule, <handler> the `handler` it gives
# EventConsumers.subscribe, <filter> `evt.<event name>` on EVENTS, or `restricted.<event name>` on
# EVENTS_RESTRICTED for an event listed in its `restrictedEvents`. A renamed handler, or one that
# consumes another event, is a new consumer with a new grant; the grant of a removed handler goes
# with it, once no running release uses it.
#
# Streams (created by nats/ensure-streams.sh, with the `admin` user):
#   EVENTS             evt.>         every event; read through the consumers granted below, and by
#                                    sequence by the dead-letter worker of notification only.
#   EVENTS_RESTRICTED  restricted.>  identity events that carry a single-use code or link for a
#                                    security e-mail; published by identity, read by notification
#                                    only (decision D7).
#   EVENTS_DLQ         dlq.>         dead letters, written by the dead-letter worker that runs in
#                                    notification-service; read by operators only.
#
# Passwords come from the environment of the container. The server reads `$NAME` as the variable
# NAME only outside quotes: the `$JS...` subjects below are quoted and literal. The value is parsed
# as configuration: letters and digits starting with a letter are always safe; a number, `true`,
# `false` or a value with a space stops the server at start-up, and a value starting with `$2` is
# taken for a bcrypt hash.
#
# A new entity adds its `evt.<entity>.>` and `rebuild.*.<entity>` subjects to the user of the
# backend that owns it, and a new backend adds its user: a publication on a subject nobody was
# given is refused. The broker reads this file at start-up only: change NATS_SERVER_CONF_SHA256 in
# infra.yaml with it, so that every environment restarts the broker.

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    # Creates and updates the streams; operators use it to read the dead letters and to remove an
    # obsolete consumer.
    {
      user: admin
      password: $NATS_ADMIN_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    }

    # Consumes the member events of organization-service: its projection of the memberships,
    # checked when a session switches organization.
    {
      user: identity
      password: $IDENTITY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.user.>", "evt.session.>", "evt.api-token.>",
            "rebuild.*.user", "rebuild.*.session", "rebuild.*.api-token",
            "restricted.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.INFO.EVENTS", "$JS.API.STREAM.INFO.EVENTS_RESTRICTED",

            "$JS.API.CONSUMER.CREATE.EVENTS.identity-service__project-member-joined.evt.member.joined.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.identity-service__project-member-joined",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.identity-service__project-member-joined",
            "$JS.ACK.EVENTS.identity-service__project-member-joined.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.identity-service__project-member-role-changed.evt.member.role-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.identity-service__project-member-role-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.identity-service__project-member-role-changed",
            "$JS.ACK.EVENTS.identity-service__project-member-role-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.identity-service__project-member-removed.evt.member.removed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.identity-service__project-member-removed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.identity-service__project-member-removed",
            "$JS.ACK.EVENTS.identity-service__project-member-removed.>"
          ]
        }
        subscribe: { allow: ["_INBOX.identity.>", "rebuild.identity.>"] }
      }
    }

    # Consumes the user events of identity-service: its directory of the users, the names, e-mails
    # and two-step verification state of the member list, and the deletion of an account, which
    # removes its memberships.
    #
    # Invitations travel on EVENTS, not on the restricted stream, by decision of the integration
    # plan: accepting one requires a session whose verified address is the invited one, so the
    # invitation id in the e-mail link is no secret capability.
    {
      user: organization
      password: $ORGANIZATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.organization.>", "evt.member.>", "evt.invitation.>", "evt.domain.>",
            "rebuild.*.organization", "rebuild.*.member", "rebuild.*.invitation",
            "rebuild.*.domain",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__project-user-signed-up.evt.user.signed-up.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__project-user-signed-up",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__project-user-signed-up",
            "$JS.ACK.EVENTS.organization-service__project-user-signed-up.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__project-user-email-verified.evt.user.email-verified.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__project-user-email-verified",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__project-user-email-verified",
            "$JS.ACK.EVENTS.organization-service__project-user-email-verified.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__project-user-profile-updated.evt.user.profile-updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__project-user-profile-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__project-user-profile-updated",
            "$JS.ACK.EVENTS.organization-service__project-user-profile-updated.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__project-user-email-changed.evt.user.email-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__project-user-email-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__project-user-email-changed",
            "$JS.ACK.EVENTS.organization-service__project-user-email-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__project-user-two-step.evt.user.two-step-verification-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__project-user-two-step",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__project-user-two-step",
            "$JS.ACK.EVENTS.organization-service__project-user-two-step.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.organization-service__remove-deleted-user.evt.user.deleted.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.organization-service__remove-deleted-user",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.organization-service__remove-deleted-user",
            "$JS.ACK.EVENTS.organization-service__remove-deleted-user.>"
          ]
        }
        subscribe: { allow: ["_INBOX.organization.>", "rebuild.organization.>"] }
      }
    }

    # Consumes nothing yet.
    {
      user: billing
      password: $BILLING_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.subscription.>", "evt.quota.>", "evt.invoice.>",
            "rebuild.*.subscription", "rebuild.*.quota", "rebuild.*.invoice",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.billing.>", "rebuild.billing.>"] }
      }
    }

    # Consumes member events, notification authorization requests, and verified Intake uploads.
    {
      user: task
      password: $TASK_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.space.>", "evt.list.>", "evt.task.>", "evt.comment.>", "evt.approval.>",
            "evt.milestone.>",
            "evt.intake.attachment-claimed.v1", "evt.intake.attachment-released.v1",
            "rebuild.*.space", "rebuild.*.list", "rebuild.*.task", "rebuild.*.comment",
            "rebuild.*.approval", "rebuild.*.milestone",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",

            "$JS.API.CONSUMER.CREATE.EVENTS.task-service__project-member-joined.evt.member.joined.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.task-service__project-member-joined",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.task-service__project-member-joined",
            "$JS.ACK.EVENTS.task-service__project-member-joined.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.task-service__project-member-role-changed.evt.member.role-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.task-service__project-member-role-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.task-service__project-member-role-changed",
            "$JS.ACK.EVENTS.task-service__project-member-role-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.task-service__project-member-removed.evt.member.removed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.task-service__project-member-removed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.task-service__project-member-removed",
            "$JS.ACK.EVENTS.task-service__project-member-removed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.task-service__decide-notification-delivery-authorization.evt.notification.delivery-authorization-requested.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.task-service__decide-notification-delivery-authorization",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.task-service__decide-notification-delivery-authorization",
            "$JS.ACK.EVENTS.task-service__decide-notification-delivery-authorization.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.task-service__verify-intake-attachment.evt.intake.attachment-verified.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.task-service__verify-intake-attachment",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.task-service__verify-intake-attachment",
            "$JS.ACK.EVENTS.task-service__verify-intake-attachment.>"
          ]
        }
        subscribe: { allow: ["_INBOX.task.>", "rebuild.task.>"] }
      }
    }

    # Consumes nothing yet.
    {
      user: document
      password: $DOCUMENT_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.doc.>",
            "rebuild.*.doc",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.document.>", "rebuild.document.>"] }
      }
    }

    # Consumes task purges and terminal Intake decisions to manage attachment objects.
    {
      user: storage
      password: $STORAGE_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.file.>",
            "evt.intake.attachment-verified.v1",
            "rebuild.*.file",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",

            "$JS.API.CONSUMER.CREATE.EVENTS.storage-service__record-task-purge.evt.task.purged.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.storage-service__record-task-purge",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.storage-service__record-task-purge",
            "$JS.ACK.EVENTS.storage-service__record-task-purge.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.storage-service__claim-intake-attachment.evt.intake.attachment-claimed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.storage-service__claim-intake-attachment",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.storage-service__claim-intake-attachment",
            "$JS.ACK.EVENTS.storage-service__claim-intake-attachment.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.storage-service__release-intake-attachment.evt.intake.attachment-released.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.storage-service__release-intake-attachment",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.storage-service__release-intake-attachment",
            "$JS.ACK.EVENTS.storage-service__release-intake-attachment.>"
          ]
        }
        subscribe: { allow: ["_INBOX.storage.>", "rebuild.storage.>"] }
      }
    }

    # Consumes the invitation event of organization-service (the invitation e-mail) and the account
    # and session events of identity-service that send a security e-mail on EVENTS, and the code
    # and password reset link events of identity-service (the code and reset e-mails) on
    # EVENTS_RESTRICTED, whose only reader it is. For that reason it also owns the dead-letter
    # worker: the worker reads a failed message by its sequence and copies it under `dlq.>`, and a
    # failed message may be a restricted one. The worker uses no consumer subject.
    {
      user: notification
      password: $NOTIFICATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.notification.>", "evt.reminder.>",
            "rebuild.*.notification", "rebuild.*.reminder",
            "dlq.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.INFO.EVENTS", "$JS.API.STREAM.INFO.EVENTS_RESTRICTED",
            "$JS.API.STREAM.INFO.EVENTS_DLQ",
            "$JS.API.STREAM.MSG.GET.EVENTS", "$JS.API.STREAM.MSG.GET.EVENTS_RESTRICTED",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-invitation-email.evt.invitation.issued.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-invitation-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-invitation-email",
            "$JS.ACK.EVENTS.notification-service__request-invitation-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-password-changed-email.evt.user.password-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-password-changed-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-password-changed-email",
            "$JS.ACK.EVENTS.notification-service__request-password-changed-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-email-changed-email.evt.user.email-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-email-changed-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-email-changed-email",
            "$JS.ACK.EVENTS.notification-service__request-email-changed-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-new-device-email.evt.session.opened-on-new-device.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-new-device-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-new-device-email",
            "$JS.ACK.EVENTS.notification-service__request-new-device-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-deletion-scheduled-email.evt.user.deletion-scheduled.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-deletion-scheduled-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-deletion-scheduled-email",
            "$JS.ACK.EVENTS.notification-service__request-deletion-scheduled-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-deletion-cancelled-email.evt.user.deletion-cancelled.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-deletion-cancelled-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-deletion-cancelled-email",
            "$JS.ACK.EVENTS.notification-service__request-deletion-cancelled-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__request-two-step-email.evt.user.two-step-verification-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__request-two-step-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__request-two-step-email",
            "$JS.ACK.EVENTS.notification-service__request-two-step-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-task-delivery-authorized.evt.task.notification-delivery-authorized.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-task-delivery-authorized",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-task-delivery-authorized",
            "$JS.ACK.EVENTS.notification-service__inbox-task-delivery-authorized.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__reminder-task-delivery-authorized.evt.task.notification-delivery-authorized.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__reminder-task-delivery-authorized",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__reminder-task-delivery-authorized",
            "$JS.ACK.EVENTS.notification-service__reminder-task-delivery-authorized.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-task-assigned.evt.task.assigned.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-task-assigned",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-task-assigned",
            "$JS.ACK.EVENTS.notification-service__inbox-task-assigned.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-task-status-changed.evt.task.status-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-task-status-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-task-status-changed",
            "$JS.ACK.EVENTS.notification-service__inbox-task-status-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-comment-created.evt.comment.created.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-comment-created",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-comment-created",
            "$JS.ACK.EVENTS.notification-service__inbox-comment-created.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-comment-updated.evt.comment.updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-comment-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-comment-updated",
            "$JS.ACK.EVENTS.notification-service__inbox-comment-updated.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-description-mentions-changed.evt.task.description-mentions-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-description-mentions-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-description-mentions-changed",
            "$JS.ACK.EVENTS.notification-service__inbox-description-mentions-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-approval-requested.evt.approval.requested.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-approval-requested",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-approval-requested",
            "$JS.ACK.EVENTS.notification-service__inbox-approval-requested.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-approval-decided.evt.approval.decided.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-approval-decided",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-approval-decided",
            "$JS.ACK.EVENTS.notification-service__inbox-approval-decided.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-task-access-requested.evt.task.access-requested.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-task-access-requested",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-task-access-requested",
            "$JS.ACK.EVENTS.notification-service__inbox-task-access-requested.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.notification-service__inbox-task-access-approved.evt.task.access-request-decided.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.notification-service__inbox-task-access-approved",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.notification-service__inbox-task-access-approved",
            "$JS.ACK.EVENTS.notification-service__inbox-task-access-approved.>",

            "$JS.API.CONSUMER.CREATE.EVENTS_RESTRICTED.notification-service__request-code-email.restricted.one-time-code.issued.v1",
            "$JS.API.CONSUMER.INFO.EVENTS_RESTRICTED.notification-service__request-code-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS_RESTRICTED.notification-service__request-code-email",
            "$JS.ACK.EVENTS_RESTRICTED.notification-service__request-code-email.>",

            "$JS.API.CONSUMER.CREATE.EVENTS_RESTRICTED.notification-service__request-password-reset-email.restricted.password-reset-link.issued.v1",
            "$JS.API.CONSUMER.INFO.EVENTS_RESTRICTED.notification-service__request-password-reset-email",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS_RESTRICTED.notification-service__request-password-reset-email",
            "$JS.ACK.EVENTS_RESTRICTED.notification-service__request-password-reset-email.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX.notification.>", "rebuild.notification.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS_RESTRICTED.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS_RESTRICTED.>"
          ]
        }
      }
    }

    # Consumes nothing yet.
    {
      user: automation
      password: $AUTOMATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.automation.>",
            "rebuild.*.automation",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.automation.>", "rebuild.automation.>"] }
      }
    }

    # Consumes nothing yet.
    {
      user: integration
      password: $INTEGRATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.git.>",
            "rebuild.*.git",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.integration.>", "rebuild.integration.>"] }
      }
    }

    # Emits nothing: it will read the events and the rebuilds of the entities it indexes, through
    # consumers granted here first. Consumes nothing yet.
    {
      user: search
      password: $SEARCH_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.search.>", "rebuild.search.>"] }
      }
    }

    # Publishes its usage event and consumes nothing.
    {
      user: "api-gateway"
      password: $API_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.api-usage.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.api-gateway.>"] }
      }
    }

    # Emits nothing: relays Identity, Organization and Task events to authorized sockets.
    {
      user: "realtime-gateway"
      password: $REALTIME_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.STREAM.INFO.REALTIME_AUTHORIZATION_ADVISORIES",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-session-revoked.evt.session.revoked.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-session-revoked",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-session-revoked",
            "$JS.ACK.EVENTS.realtime-gateway__relay-session-revoked.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-session-organization-changed.evt.session.organization-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-session-organization-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-session-organization-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-session-organization-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-member-role-changed.evt.member.role-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-member-role-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-member-role-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-member-role-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-member-removed.evt.member.removed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-member-removed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-member-removed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-member-removed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-updated.evt.space.updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-updated",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-updated.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-access-changed.evt.space.access-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-access-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-access-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-access-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-access-republished.evt.space.access-republished.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-access-republished",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-access-republished",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-access-republished.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-deleted.evt.space.deleted.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-deleted",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-deleted",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-deleted.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-list-access-changed.evt.list.access-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-list-access-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-list-access-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-list-access-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-list-deleted.evt.list.deleted.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-list-deleted",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-list-deleted",
            "$JS.ACK.EVENTS.realtime-gateway__relay-list-deleted.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-updated.evt.task.updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-updated",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-updated.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-status-changed.evt.task.status-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-status-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-status-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-status-changed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-trashed.evt.task.trashed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-trashed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-trashed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-trashed.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-purged.evt.task.purged.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-purged",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-purged",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-purged.>",

            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-comment-created.evt.comment.created.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-comment-created",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-comment-created",
            "$JS.ACK.EVENTS.realtime-gateway__relay-comment-created.>"
