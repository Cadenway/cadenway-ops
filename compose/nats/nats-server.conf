# NATS server of one environment: JetStream, and one user per backend (docs/messaging.md).
#
# A user may publish the events of the entities its backend owns (`evt.<entity>.>`) and re-emit
# their current state for a consumer that rebuilds (`rebuild.<consumer>.<entity>`), and nothing
# else. Events are read through JetStream consumers, never through a plain subscription: nobody may
# subscribe to `evt.>` or `restricted.>`, and a user receives its messages on its own inbox
# prefix, `_INBOX.<user>.>`, so no backend can listen to the replies of another one. A rebuild is
# plain NATS: a user may subscribe to `rebuild.<user>.>` only.
#
# Reading is not granted per subject. A backend that consumes may create a durable consumer on
# EVENTS with any filter, pull from it and acknowledge, which is what @cadenway/nest-messaging
# does for each handler (`CONSUMER.INFO` and
# `$JS.API.CONSUMER.CREATE.EVENTS.<service>__<handler>.<subject>`, then `CONSUMER.MSG.NEXT` and
# `$JS.ACK` on that consumer): a new consumer needs no new right. The rights are per stream, not
# per consumer: a backend that consumes may also pull from, acknowledge on or change the consumer
# of another one (docs/messaging.md), so what must reach one backend only goes on the restricted
# stream. Among the events backends read from one another, identity, organization and
# notification read:
#   identity      evt.member.>, evt.organization.>  its projection of the memberships
#   organization  evt.user.>                        its directory of the users
#   notification  evt.invitation.>                  the invitation e-mail
#                 restricted.>                      the security e-mails
#
# Streams (created by nats/ensure-streams.sh, with the `admin` user):
#   EVENTS             evt.>         every event; any backend that consumes may read it.
#   EVENTS_RESTRICTED  restricted.>  identity events that carry a single-use code or link for a
#                                    security e-mail; published by identity, read by notification
#                                    only (decision D7).
#   EVENTS_DLQ         dlq.>         dead letters, written by the dead-letter worker that runs in
#                                    notification-service; read by operators only.
#
# Passwords come from the environment of the container. The server reads `$NAME` as the variable
# NAME only outside quotes: the `$JS...` subjects below are quoted and literal. The value is parsed
# as configuration: letters and digits starting with a letter are always safe; a number, `true`,
# `false` or a value with a space stops the server at start-up, and a value starting with `$2` is
# taken for a bcrypt hash.
#
# A new entity adds its `evt.<entity>.>` and `rebuild.*.<entity>` subjects to the user of the
# backend that owns it, and a new backend adds its user: a publication on a subject nobody was
# given is refused. The broker reads this file at start-up only: change NATS_SERVER_CONF_SHA256 in
# infra.yaml with it, so that every environment restarts the broker.

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    # Creates and updates the streams; operators use it to read the dead letters.
    {
      user: admin
      password: $NATS_ADMIN_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    }

    {
      user: identity
      password: $IDENTITY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.user.>", "evt.session.>", "evt.api-token.>",
            "rebuild.*.user", "rebuild.*.session", "rebuild.*.api-token",
            "restricted.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.INFO.EVENTS", "$JS.API.STREAM.INFO.EVENTS_RESTRICTED",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.identity.>", "rebuild.identity.>"] }
      }
    }

    # Invitations travel on EVENTS, not on the restricted stream, by decision of the integration
    # plan: accepting one requires a session whose verified address is the invited one, so the
    # invitation id in the e-mail link is no secret capability.
    {
      user: organization
      password: $ORGANIZATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.organization.>", "evt.member.>", "evt.invitation.>", "evt.domain.>",
            "rebuild.*.organization", "rebuild.*.member", "rebuild.*.invitation",
            "rebuild.*.domain",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.organization.>", "rebuild.organization.>"] }
      }
    }

    {
      user: billing
      password: $BILLING_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.subscription.>", "evt.quota.>", "evt.invoice.>",
            "rebuild.*.subscription", "rebuild.*.quota", "rebuild.*.invoice",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.billing.>", "rebuild.billing.>"] }
      }
    }

    {
      user: task
      password: $TASK_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.space.>", "evt.list.>", "evt.task.>", "evt.comment.>", "evt.approval.>",
            "evt.milestone.>",
            "rebuild.*.space", "rebuild.*.list", "rebuild.*.task", "rebuild.*.comment",
            "rebuild.*.approval", "rebuild.*.milestone",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.task.>", "rebuild.task.>"] }
      }
    }

    {
      user: document
      password: $DOCUMENT_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.doc.>",
            "rebuild.*.doc",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.document.>", "rebuild.document.>"] }
      }
    }

    {
      user: storage
      password: $STORAGE_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.file.>",
            "rebuild.*.file",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.storage.>", "rebuild.storage.>"] }
      }
    }

    # The only reader of EVENTS_RESTRICTED, and for that reason the owner of the dead-letter
    # worker: the worker reads a failed message by its sequence and copies it under `dlq.>`, and a
    # failed message may be a restricted one.
    {
      user: notification
      password: $NOTIFICATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.notification.>", "evt.reminder.>",
            "rebuild.*.notification", "rebuild.*.reminder",
            "dlq.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.INFO.EVENTS", "$JS.API.STREAM.INFO.EVENTS_RESTRICTED",
            "$JS.API.STREAM.INFO.EVENTS_DLQ",
            "$JS.API.STREAM.MSG.GET.EVENTS", "$JS.API.STREAM.MSG.GET.EVENTS_RESTRICTED",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>",
            "$JS.API.CONSUMER.CREATE.EVENTS_RESTRICTED.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS_RESTRICTED.*",
            "$JS.API.CONSUMER.INFO.EVENTS_RESTRICTED.*",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS_RESTRICTED.*",
            "$JS.ACK.EVENTS_RESTRICTED.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX.notification.>", "rebuild.notification.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS_RESTRICTED.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS.>",
            "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS_RESTRICTED.>"
          ]
        }
      }
    }

    {
      user: automation
      password: $AUTOMATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.automation.>",
            "rebuild.*.automation",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.automation.>", "rebuild.automation.>"] }
      }
    }

    {
      user: integration
      password: $INTEGRATION_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.git.>",
            "rebuild.*.git",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.integration.>", "rebuild.integration.>"] }
      }
    }

    # Emits nothing: it reads the events and the rebuilds of the entities it indexes.
    {
      user: search
      password: $SEARCH_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.search.>", "rebuild.search.>"] }
      }
    }

    # Publishes its usage event and consumes nothing.
    {
      user: "api-gateway"
      password: $API_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "evt.api-usage.>",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS"
          ]
        }
        subscribe: { allow: ["_INBOX.api-gateway.>"] }
      }
    }

    # Relays events to the sockets and emits nothing.
    {
      user: "realtime-gateway"
      password: $REALTIME_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
            "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
            "$JS.ACK.EVENTS.>"
          ]
        }
        subscribe: { allow: ["_INBOX.realtime-gateway.>"] }
      }
    }
  ]
}
