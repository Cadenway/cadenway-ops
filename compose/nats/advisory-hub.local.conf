# Extend the event broker for the local observer. Service grants and streams are inherited.
include nats-server.conf

# NATS treats option names case-insensitively and appends users from each authorization block.
# Preserve the included lower-case key in the configuration map.
Authorization {
  users: [
    {
      user: "advisory-leaf"
      password: $NATS_ADVISORY_LEAF_PASSWORD
      allowed_connection_types: ["LEAFNODE"]
      permissions {
        publish: { deny: [">"] }
        subscribe: [
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.>",
          "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS.>",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS_RESTRICTED.>",
          "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.EVENTS_RESTRICTED.>"
        ]
      }
    }
  ]
}

# Compose attaches this alias to the separate network shared by the two brokers.
leafnodes { listen: "nats-advisory-hub:7422" }
