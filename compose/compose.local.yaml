# Development overrides only: the same stack on a workstation.
#
#   cp .env.example .env        (once; Compose reads compose/.env, which names this file and the
#                                profile in COMPOSE_FILE and COMPOSE_PROFILES)
#   docker compose up -d
#   docker compose watch task-service
#
# Every deployable is built from its sibling folder (clone the repositories flat, side by side) and
# rebuilt by `watch` when its sources change. `core` starts the first version (identity,
# organization, task, notification, API gateway, web application); `full` starts everything.
# Browsers resolve `*.localhost` to the machine: http://app.cadenway.localhost,
# http://mail.cadenway.localhost.
#
# Garage is the local object store, the stand-in for OVH Object Storage: S3 API on
# http://s3.cadenway.localhost for the browser and on http://garage:3900 inside the stack, region
# `garage`, path-style addressing. It starts with the `full` profile, like the storage service.

x-data: &data
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy

x-redis: &redis
  redis:
    condition: service_healthy

services:
  traefik:
    # The production Traefik lives in edge.yaml, a project of its own on each host. A workstation
    # runs one stack, so the local Traefik sits in it: plain HTTP on one entry point, no TLS.
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - '127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  mailpit:
    image: axllent/mailpit:v1.29.0@sha256:0f93f36075f5f6fe428655d94299dda59b9a533d3fe9ce62909a72ac6fe455a9
    restart: unless-stopped
    networks:
      - edge
      - internal
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mailpit.rule: Host(`mail.${DOMAIN}`)
      traefik.http.services.mailpit.loadbalancer.server.port: '8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  garage:
    # One node, no replication: `--single-node` assigns the layout, `--default-bucket` creates the
    # access key and the bucket named in compose/.env. Both are idempotent across restarts.
    profiles: [full]
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - edge
      - internal
    labels:
      # Signed URLs are made for the host the browser sees, so the S3 API goes through Traefik.
      traefik.enable: 'true'
      traefik.http.routers.garage.rule: Host(`s3.${DOMAIN}`)
      traefik.http.services.garage.loadbalancer.server.port: '3900'
    healthcheck:
      # The image has no shell and no HTTP client: the binary asks its own node over RPC.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api-gateway:
    profiles: [core, full]
    build:
      context: ../../cadenway-api-gateway
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-api-gateway/src
    depends_on: *redis

  realtime-gateway:
    profiles: [full]
    build:
      context: ../../cadenway-realtime-gateway
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-realtime-gateway/src
    depends_on:
      <<: *redis
      nats:
        condition: service_healthy

  identity-service:
    profiles: [core, full]
    build:
      context: ../../cadenway-identity-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-identity-service/src
    depends_on: *data

  organization-service:
    profiles: [core, full]
    build:
      context: ../../cadenway-organization-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-organization-service/src
    depends_on: *data

  billing-service:
    profiles: [full]
    build:
      context: ../../cadenway-billing-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-billing-service/src
    depends_on: *data

  task-service:
    profiles: [core, full]
    build:
      context: ../../cadenway-task-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-task-service/src
    depends_on: *data

  document-service:
    profiles: [full]
    build:
      context: ../../cadenway-document-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-document-service/src
    depends_on: *data

  storage-service:
    profiles: [full]
    build:
      context: ../../cadenway-storage-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-storage-service/src
    depends_on: *data

  notification-service:
    profiles: [core, full]
    build:
      context: ../../cadenway-notification-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-notification-service/src
    depends_on: *data

  automation-service:
    profiles: [full]
    build:
      context: ../../cadenway-automation-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-automation-service/src
    depends_on: *data

  integration-service:
    profiles: [full]
    build:
      context: ../../cadenway-integration-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-integration-service/src
    depends_on: *data

  search-service:
    profiles: [full]
    build:
      context: ../../cadenway-search-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-search-service/src
    depends_on: *data

  webapp:
    profiles: [core, full]
    build:
      context: ../../cadenway-webapp
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-webapp/src

  website:
    profiles: [full]
    build:
      context: ../../cadenway-website
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-website/src

# On a server the edge network of an environment is external, created by edge.yaml. Locally this
# stack creates it.
# The images install the private @cadenway/* packages: their build mounts a user-level npmrc as a
# secret. It comes from the NPMRC environment variable of the shell that runs Compose, never from a
# file of this repository. See docs/development.md.
secrets:
  npmrc:
    environment: NPMRC

networks:
  edge: !override
    name: cadenway-edge-local

volumes:
  garage-meta:
  garage-data:
