# Development overrides only: the same stack on a workstation.
#
#   cp .env.example .env        (once; Compose reads compose/.env, which names this file and the
#                                profile in COMPOSE_FILE and COMPOSE_PROFILES)
#   docker compose run --rm internal-token-keys
#                               (once; writes the key pairs of the internal token into compose/.env)
#   docker compose up -d
#   docker compose watch task-service
#
# Every deployable is built from its sibling folder (clone the repositories flat, side by side) and
# rebuilt by `watch` when its sources change. `core` starts the first version (identity,
# organization, task, notification, API gateway, web application); `full` starts everything.
# Browsers resolve `*.localhost` to the machine: http://app.cadenway.localhost,
# http://mail.cadenway.localhost.
#
# The `environment` entries below are the ones each backend's own deploy/compose.yaml declares
# (docs/service-environment.md lists them). They are repeated here because the stack runs the
# definitions of the last release with images built from the sources: a variable the sources read
# must not wait for a release to exist locally. Same names, same variables of compose/.env.
#
# One entry is local only: MIGRATION_DATABASE_URL, the URL of the migrator that owns the database of
# each service. On a server the GitOps agent gives it to the one-off migration container alone; here
# the service keeps it, with the placeholders of compose/.env.example, so that
# `docker compose run --rm --no-deps <service> node dist/migrate.js` applies the migrations
# (docs/database.md).
#
# Garage is the local object store, the stand-in for OVH Object Storage: S3 API on
# http://s3.cadenway.localhost for the browser and on http://garage:3900 inside the stack, region
# `garage`, path-style addressing. It starts with the `full` profile, like the storage service.

# `nats-streams` is healthy once the broker is up and the streams exist.
x-data: &data
  postgres:
    condition: service_healthy
  nats-streams:
    condition: service_healthy

x-redis: &redis
  redis:
    condition: service_healthy

# The exposed services of the staging definitions point Traefik at `cadenway-edge-<env>`; locally
# their edge network is the one of the project (`networks` at the end of this file).
x-edge: &edge
  traefik.docker.network: ${COMPOSE_PROJECT_NAME}-edge-local

services:
  traefik:
    # The production Traefik lives in edge.yaml, a project of its own on each host. Locally each
    # stack has its own: plain HTTP on one entry point, no TLS. A second stack on the same machine
    # (`docker compose -p <name>`, with another TRAEFIK_HTTP_PORT) never routes to this one: each
    # Traefik serves the containers of its own project, on the edge network of that project.
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # The Docker socket lists the containers of every project on the host: without this
      # constraint two local stacks merge their routers and balance requests between them.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)
      # For the containers without a `traefik.docker.network` label (Mailpit, Garage): on two
      # networks, Traefik would otherwise pick either address, and `internal` is out of its reach.
      - --providers.docker.network=${COMPOSE_PROJECT_NAME}-edge-local
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - '127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  mailpit:
    image: axllent/mailpit:v1.29.0@sha256:0f93f36075f5f6fe428655d94299dda59b9a533d3fe9ce62909a72ac6fe455a9
    restart: unless-stopped
    networks:
      - edge
      - internal
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mailpit.rule: Host(`mail.${DOMAIN}`)
      traefik.http.services.mailpit.loadbalancer.server.port: '8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  garage:
    # One node, no replication: `--single-node` assigns the layout, `--default-bucket` creates the
    # access key and the bucket named in compose/.env. Both are idempotent across restarts.
    profiles: [full]
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      # Garage's HTTP request logger includes the query string of presigned download URLs.
      RUST_LOG: 'info,garage_api_common::generic_server=error'
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - edge
      - internal
    labels:
      # Signed URLs are made for the host the browser sees, so the S3 API goes through Traefik.
      traefik.enable: 'true'
      traefik.http.routers.garage.rule: Host(`s3.${DOMAIN}`)
      traefik.http.services.garage.loadbalancer.server.port: '3900'
    healthcheck:
      # The image has no shell and no HTTP client: the binary asks its own node over RPC.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  internal-token-keys:
    # Not part of the stack: run once, by hand, after `cp .env.example .env`. It appends to
    # compose/.env the Ed25519 key pair of each backend that signs the internal token, so that no
    # private key is ever committed and Compose reads the keys like any other variable. A second
    # run changes nothing. `docker compose run --rm internal-token-keys --print` prints fresh pairs
    # instead, for the secrets of an environment. No network, no health check: it exits at once.
    profiles: [setup]
    image: node:24.22.3-alpine3.24@sha256:98e4e60b35fd50143e1838da2957488c25aa3a3efbd48bb679923f77d6d3d873
    restart: 'no'
    network_mode: none
    entrypoint: ['node', '/stack/internal-token/generate-keys.mjs']
    command: ['/stack/.env']
    volumes:
      - .:/stack
    deploy:
      resources:
        limits:
          memory: 64M

  api-gateway:
    profiles: [core, full]
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-https}://app.${DOMAIN},${PUBLIC_SCHEME:-https}://${DOMAIN}
      INTERNAL_TOKEN_ISSUER: api-gateway
      INTERNAL_TOKEN_PRIVATE_JWK: ${API_GATEWAY_INTERNAL_TOKEN_PRIVATE_JWK}
      NATS_URL: ${NATS_URL}
      NATS_USER: api-gateway
      NATS_PASSWORD: ${API_GATEWAY_NATS_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AUTOMATION_SERVICE_URL: ${AUTOMATION_SERVICE_URL}
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL}
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL}
    labels: *edge
    build:
      context: ../../cadenway-api-gateway
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-api-gateway/src
    depends_on: *redis

  realtime-gateway:
    profiles: [full]
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-https}://app.${DOMAIN}
      INTERNAL_TOKEN_ISSUER: realtime-gateway
      INTERNAL_TOKEN_PRIVATE_JWK: ${REALTIME_GATEWAY_INTERNAL_TOKEN_PRIVATE_JWK}
      NATS_USER: realtime-gateway
      NATS_PASSWORD: ${REALTIME_GATEWAY_NATS_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
    labels: *edge
    build:
      context: ../../cadenway-realtime-gateway
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-realtime-gateway/src
    depends_on:
      <<: *redis
      nats-streams:
        condition: service_healthy

  identity-service:
    profiles: [core, full]
    environment:
      MIGRATION_DATABASE_URL: ${IDENTITY_SERVICE_MIGRATION_DATABASE_URL}
      PASSWORD_PEPPER: ${IDENTITY_PASSWORD_PEPPER}
      WEBAUTHN_RP_ID: app.${DOMAIN}
      WEBAUTHN_ORIGINS: ${PUBLIC_SCHEME:-https}://app.${DOMAIN}
      NATS_USER: identity
      NATS_PASSWORD: ${IDENTITY_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: identity-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "realtime-gateway": [${REALTIME_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    build:
      context: ../../cadenway-identity-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-identity-service/src
    depends_on: *data

  organization-service:
    profiles: [core, full]
    environment:
      MIGRATION_DATABASE_URL: ${ORGANIZATION_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: organization
      NATS_PASSWORD: ${ORGANIZATION_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: organization-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    build:
      context: ../../cadenway-organization-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-organization-service/src
    depends_on: *data

  billing-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${BILLING_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: billing
      NATS_PASSWORD: ${BILLING_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: billing-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    build:
      context: ../../cadenway-billing-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-billing-service/src
    depends_on: *data

  task-service:
    profiles: [core, full]
    environment:
      MIGRATION_DATABASE_URL: ${TASK_SERVICE_MIGRATION_DATABASE_URL}
      TRASH_WRITES_ENABLED: ${TASK_SERVICE_TRASH_WRITES_ENABLED:-true}
      NATS_USER: task
      NATS_PASSWORD: ${TASK_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: task-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "realtime-gateway": [${REALTIME_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "automation-service": [${AUTOMATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "integration-service": [${INTEGRATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    build:
      context: ../../cadenway-task-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-task-service/src
    depends_on: *data

  document-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${DOCUMENT_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: document
      NATS_PASSWORD: ${DOCUMENT_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: document-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    build:
      context: ../../cadenway-document-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-document-service/src
    depends_on: *data

  storage-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${STORAGE_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: storage
      NATS_PASSWORD: ${STORAGE_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: storage-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT}
      S3_REGION: ${STORAGE_S3_REGION}
      S3_BUCKET: ${STORAGE_S3_BUCKET}
      S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE}
      STORAGE_UPLOAD_RECEIPT_KEYS: ${STORAGE_UPLOAD_RECEIPT_KEYS:-}
    build:
      context: ../../cadenway-storage-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-storage-service/src
    depends_on:
      <<: *data
      garage:
        condition: service_healthy

  notification-service:
    profiles: [core, full]
    environment:
      MIGRATION_DATABASE_URL: ${NOTIFICATION_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: notification
      NATS_PASSWORD: ${NOTIFICATION_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: notification-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}],
        "automation-service": [${AUTOMATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      WEB_APP_URL: ${PUBLIC_SCHEME:-https}://app.${DOMAIN}
    build:
      context: ../../cadenway-notification-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-notification-service/src
    depends_on: *data

  automation-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${AUTOMATION_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: automation
      NATS_PASSWORD: ${AUTOMATION_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: automation-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      INTERNAL_TOKEN_ISSUER: automation-service
      INTERNAL_TOKEN_PRIVATE_JWK: ${AUTOMATION_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    build:
      context: ../../cadenway-automation-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-automation-service/src
    depends_on: *data

  integration-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${INTEGRATION_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: integration
      NATS_PASSWORD: ${INTEGRATION_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: integration-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      INTERNAL_TOKEN_ISSUER: integration-service
      INTERNAL_TOKEN_PRIVATE_JWK: ${INTEGRATION_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
    build:
      context: ../../cadenway-integration-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-integration-service/src
    depends_on: *data

  search-service:
    profiles: [full]
    environment:
      MIGRATION_DATABASE_URL: ${SEARCH_SERVICE_MIGRATION_DATABASE_URL}
      NATS_USER: search
      NATS_PASSWORD: ${SEARCH_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: search-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      MEILI_URL: ${MEILI_URL}
      MEILI_API_KEY: ${MEILI_MASTER_KEY}
    build:
      context: ../../cadenway-search-service
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-search-service/src
    depends_on:
      <<: *data
      meilisearch:
        condition: service_healthy

  webapp:
    profiles: [core, full]
    labels: *edge
    build:
      context: ../../cadenway-webapp
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-webapp/src

  website:
    profiles: [full]
    labels: *edge
    build:
      context: ../../cadenway-website
      secrets: [npmrc]
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-website/src

# The images install the private @cadenway/* packages: their build mounts a user-level npmrc as a
# secret. It comes from the NPMRC environment variable of the shell that runs Compose, never from a
# file of this repository. See docs/development.md.
secrets:
  npmrc:
    environment: NPMRC

# On a server the edge network of an environment is external, created by edge.yaml. Locally this
# stack creates it, named after the project so that two stacks never share it:
# `cadenway-edge-local` for the default project, `<name>-edge-local` for `-p <name>`.
# tests/local-isolation.sh checks it with the Traefik constraint above.
networks:
  edge: !override
    name: ${COMPOSE_PROJECT_NAME}-edge-local

volumes:
  garage-meta:
  garage-data:
