# Development overrides only: the same stack on a workstation.
#
#   cp .env.example .env        (once; Compose reads compose/.env)
#   docker compose -f compose.yaml -f compose.local.yaml --profile core up -d
#   docker compose -f compose.yaml -f compose.local.yaml watch task-service
#
# Every deployable is built from its sibling folder (clone the repositories flat, side by side) and
# rebuilt by `watch` when its sources change. `core` starts the first version (identity, task,
# notification, API gateway, web application); `full` starts everything. Browsers resolve
# `*.localhost` to the machine: http://app.cadenway.localhost, http://mail.cadenway.localhost.
#
# MinIO is not here yet: its image is no longer published on Docker Hub, and the local object store
# is chosen with the storage service.

x-data: &data
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy

x-redis: &redis
  redis:
    condition: service_healthy

services:
  traefik:
    # Plain HTTP on one entry point: no certificate and no redirection on a workstation.
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cadenway_edge
      - --entrypoints.web.address=:80
      - --ping=true
    ports: !override
      - '127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80'

  mailpit:
    image: axllent/mailpit:v1.29.0@sha256:0f93f36075f5f6fe428655d94299dda59b9a533d3fe9ce62909a72ac6fe455a9
    restart: unless-stopped
    networks:
      - edge
      - internal
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mailpit.rule: Host(`mail.${DOMAIN}`)
      traefik.http.services.mailpit.loadbalancer.server.port: '8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  api-gateway:
    profiles: [core, full]
    build: ../../cadenway-api-gateway
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-api-gateway/src
    depends_on: *redis

  realtime-gateway:
    profiles: [full]
    build: ../../cadenway-realtime-gateway
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-realtime-gateway/src
    depends_on:
      <<: *redis
      nats:
        condition: service_healthy

  identity-service:
    profiles: [core, full]
    build: ../../cadenway-identity-service
    develop:
      watch:
        - action: rebuild
          path: ../../cadenway-identity-service/src
    depends_on: *data

  organization-service:
