# Ansible configuration of cadenway-ops; run every command from the repository root:
#   ansible-playbook ansible/playbooks/setup.yml --check --diff
[defaults]
inventory = ansible/inventory/hosts.yml
roles_path = ansible/roles
collections_path = .ansible/collections
interpreter_python = auto_silent
result_format = yaml
retry_files_enabled = false

[ssh_connection]
pipelining = true
