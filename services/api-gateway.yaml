# Definition of api-gateway for Docker Compose. CI copies this file into
# cadenway-ops/services/api-gateway.yaml on each release: keep it self-contained.
#
# Exposed through Traefik on api.<domain>: it joins `edge` (what Traefik serves) and `internal` (the
# services it calls). No port is published; Traefik reaches the container on the `edge` network.
services:
  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/cadenway-api-gateway:${API_GATEWAY_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3000'
      REDIS_URL: ${REDIS_URL}
    networks:
      - edge
      - internal
    labels:
      traefik.enable: 'true'
      traefik.http.routers.api-gateway.rule: Host(`api.${DOMAIN}`)
      traefik.http.services.api-gateway.loadbalancer.server.port: '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every definition it includes.
networks:
  edge: {}
  internal: {}
